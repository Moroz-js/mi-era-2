name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image repo (lowercase)
        shell: bash
        run: |
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push app image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Deploy via SSH (Docker Compose)
        uses: appleboy/ssh-action@v1.0.0
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DOMAIN: ${{ secrets.DOMAIN }}
          APP_IMAGE: ${{ env.IMAGE_REPO }}:${{ env.IMAGE_SHA }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: PROJECT_NAME,DOMAIN,APP_IMAGE,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,ADMIN_USERNAME,ADMIN_PASSWORD,GOOGLE_ANALYTICS_ID,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "DEBUG PROJECT_NAME=${PROJECT_NAME}"
            PROJECT_DIR="/var/www/${PROJECT_NAME}"

            echo "▶ Deploying ${PROJECT_NAME}"
            cd "${PROJECT_DIR}"

            git fetch --all
            git reset --hard origin/main

            echo "▶ Generating .env from GitHub Secrets"
            umask 077
            cat > .env <<EOF
            # Project
            PROJECT_NAME=${PROJECT_NAME}
            APP_IMAGE=${APP_IMAGE}

            # Runtime
            NODE_ENV=production

            # URLs
            BASE_URL=https://${DOMAIN}
            NEXT_PUBLIC_BASE_URL=https://${DOMAIN}

            # Database (Docker internal host: postgres)
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

            # Email (SMTP)
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            SMTP_FROM=${SMTP_FROM}

            # Admin
            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}

            # Analytics
            GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}
            NEXT_PUBLIC_GA_ID=${GOOGLE_ANALYTICS_ID}
            EOF
            chmod 600 .env

            echo "▶ Starting Postgres"
            docker compose up -d postgres

            echo "▶ Waiting for Postgres"
            ready=0
            for i in {1..60}; do
              if docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then
                echo "✓ Postgres ready"
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "✗ Postgres not ready"
              docker compose logs --tail=200 postgres || true
              exit 1
            fi


            # NOTE: written to avoid `set -e` quirks with failed test commands in some shells
            if [ -z "${GHCR_TOKEN:-}" ] || [ -z "${GHCR_USERNAME:-}" ]; then
              echo "▶ GHCR credentials not provided; trying anonymous pull"
            else
              echo "▶ Logging in to GHCR"
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            fi

            echo "▶ Pulling app image"
            docker compose pull app

            echo "▶ Recreating app container"
            docker compose up -d --no-build --force-recreate app

            sleep 2

            echo "▶ Ensuring uploads directory"
            docker compose exec -T app mkdir -p /app/public/uploads
            docker compose exec -T app chmod -R 755 /app/public/uploads

            echo "▶ Running migrations"
            docker compose exec -T app npm run db:migrate || \
              docker compose exec -T app npx drizzle-kit migrate

            echo "▶ Running seed (optional)"
            docker compose exec -T app npm run db:seed || true

            docker compose ps
            docker compose logs --tail=60 app

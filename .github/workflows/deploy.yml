name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (key) - Docker Compose (clean frontend)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/mi-era

            git fetch --all
            git reset --hard origin/main

            # DB/volume stays — just ensure it's running
            docker compose up -d postgres

            # --- HARD CLEAN frontend artifacts on host (does NOT touch DB) ---
            # These folders can "leak" into docker build context if not dockerignored
            rm -rf .next .turbo node_modules || true

            # stop/remove only app container (postgres untouched)
            docker compose stop app || true
            docker compose rm -f app || true

            # remove app image so it can't be reused
            docker image rm -f mi-era-app:latest 2>/dev/null || true

            # optional: clean build cache (safe for DB)
            docker builder prune -af || true
            docker buildx prune -af || true

            # build app from scratch (no cache, pull base image)
            DOCKER_BUILDKIT=1 docker compose build --no-cache --pull --progress=plain app

            # start/recreate app
            docker compose up -d --force-recreate app

            # wait for postgres readiness
            for i in {1..30}; do
              if docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1; then
                echo "Postgres is ready"
                break
              fi
              echo "Waiting for Postgres..."
              sleep 2
            done

            # маленькая пауза чтобы app точно поднялся (уменьшает race)
            sleep 2

            # migrations (не роняем job на проверках)
            docker compose exec -T app npm run db:push || docker compose exec -T app npx drizzle-kit push || true

            # seed optional
            docker compose exec -T app npm run db:seed || true

            docker compose ps
            docker compose logs --tail=80 app

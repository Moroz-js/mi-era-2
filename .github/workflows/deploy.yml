name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (key) - Docker Compose (clean frontend)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/mi-era

            git fetch --all
            git reset --hard origin/main

            # 1) Ensure DB is up (no downtime)
            docker compose up -d postgres

            # 2) Wait for Postgres + auth check (no downtime)
            for i in {1..30}; do
              if docker compose exec -T postgres sh -lc 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select 1" >/dev/null'; then
                echo "Postgres auth OK"
                break
              fi
              echo "Waiting for Postgres auth..."
              sleep 2
            done

            # 3) IMPORTANT: normalize postgres password BEFORE app rebuild/switch
            # (since you observe it "breaks" after deploy)
            docker compose exec -T postgres psql -U postgres -d postgres -c "ALTER USER postgres WITH PASSWORD 'postgres';"

            # re-check auth after reset
            docker compose exec -T postgres sh -lc 'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select 1" >/dev/null'

            # 4) Build new app image while old app keeps running (no downtime)
            rm -rf .next .turbo node_modules || true

            # (optional) don’t nuke all build cache each deploy – it slows deploys; but keeps as you had
            docker builder prune -af || true
            docker buildx prune -af || true

            DOCKER_BUILDKIT=1 docker compose build --no-cache --pull --progress=plain app

            # 5) Fast switch: recreate app container (short downtime only here)
            # This will apply new volume mounts from docker-compose.yml
            docker compose up -d --force-recreate app

            # small pause for app boot
            sleep 2

            # 6) Ensure uploads directory exists with proper permissions
            docker compose exec -T app mkdir -p /app/public/uploads
            docker compose exec -T app chmod -R 755 /app/public/uploads

            # 7) Migrations/seed
            # NOTE: better to NOT swallow migration errors in prod
            docker compose exec -T app npm run db:push || docker compose exec -T app npx drizzle-kit push
            docker compose exec -T app npm run db:seed || true

            docker compose ps
            docker compose logs --tail=80 app


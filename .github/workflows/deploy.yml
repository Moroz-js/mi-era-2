name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH (Docker Compose)
        uses: appleboy/ssh-action@v1.0.0
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          DOMAIN: ${{ secrets.DOMAIN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          GOOGLE_ANALYTICS_ID: ${{ secrets.GOOGLE_ANALYTICS_ID }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script_stop: true
          script: |
            set -euo pipefail

            PROJECT_DIR="/var/www/${PROJECT_NAME}"

            echo "▶ Deploying ${PROJECT_NAME}"
            cd "${PROJECT_DIR}"

            git fetch --all
            git reset --hard origin/main

            echo "▶ Generating .env from GitHub Secrets"
            umask 077
            cat > .env <<EOF
            # Project
            PROJECT_NAME=${PROJECT_NAME}

            # Runtime
            NODE_ENV=production

            # URLs
            BASE_URL=https://${DOMAIN}
            NEXT_PUBLIC_BASE_URL=https://${DOMAIN}

            # Database (Docker internal host: postgres)
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

            # Email (SMTP)
            SMTP_HOST=${SMTP_HOST}
            SMTP_PORT=${SMTP_PORT}
            SMTP_USER=${SMTP_USER}
            SMTP_PASSWORD=${SMTP_PASSWORD}
            SMTP_FROM=${SMTP_FROM}

            # Admin
            ADMIN_USERNAME=${ADMIN_USERNAME}
            ADMIN_PASSWORD=${ADMIN_PASSWORD}

            # Analytics
            GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}
            EOF
            chmod 600 .env

            echo "▶ Starting Postgres"
            docker compose up -d postgres

            echo "▶ Waiting for Postgres"
            for i in {1..30}; do
              if docker compose exec -T postgres sh -lc \
                'PGPASSWORD="$POSTGRES_PASSWORD" psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "select 1"' \
                >/dev/null; then
                echo "✓ Postgres ready"
                break
              fi
              sleep 2
            done

            echo "▶ Building app image"
            rm -rf .next .turbo node_modules || true
            docker buildx prune -af || true

            DOCKER_BUILDKIT=1 docker compose build --pull app

            echo "▶ Recreating app container"
            docker compose up -d --force-recreate app

            sleep 2

            echo "▶ Ensuring uploads directory"
            docker compose exec -T app mkdir -p /app/public/uploads
            docker compose exec -T app chmod -R 755 /app/public/uploads

            echo "▶ Running migrations"
            docker compose exec -T app npm run db:push || \
              docker compose exec -T app npx drizzle-kit push

            echo "▶ Running seed (optional)"
            docker compose exec -T app npm run db:seed || true

            docker compose ps
            docker compose logs --tail=60 app
